<style id="hl-old-form">
/* simple version of the "Website Landing Page New" form, styled like the original dark form */
.elementor-element-9df76f9 .scf label, .elementor-element-9df76f9 .scf-note,
.elementor-element-9df76f9 .scf-field:has(.scf-pills), .elementor-element-9df76f9 .scf-field:has([name="your-site"]){display:none !important;}
.elementor-element-9df76f9 .scf-row{display:block;}
.elementor-element-9df76f9 .scf-field{margin:0;}
.elementor-element-9df76f9 .scf br{display:none;}
.elementor-element-9df76f9 .wpcf7-not-valid-tip{margin:-24px 0 18px;font-size:13px;}
.elementor-element-9df76f9 .scf-submit input{margin-top:30px;}
</style>
<script nowprocket>
(function(){
  function go(){
    var slot=document.querySelector('.elementor-element-9df76f9'); if(!slot) return;
    var ph={'your-name':'Your Name','your-email':'Your Email','your-phone':'Your Contact Number','your-company':'Your Company','your-message':'Your Brief'};
    Object.keys(ph).forEach(function(n){ var f=slot.querySelector('[name="'+n+'"]'); if(f){ f.setAttribute('placeholder',ph[n]); f.setAttribute('aria-label',ph[n].replace(/^Your /,'')); } });
    var hidden=[['project-type','Other'],['project-budget',"I'm not sure yet"]];
    function fill(){ hidden.forEach(function(p){ if(slot.querySelector('input[type=radio][name="'+p[0]+'"]:checked')) return; var r=slot.querySelector('input[type=radio][name="'+p[0]+'"][value="'+p[1]+'"]')||slot.querySelector('input[type=radio][name="'+p[0]+'"]'); if(r) r.checked=true; }); }
    fill();
    slot.addEventListener('submit',fill,true);
    slot.addEventListener('pointerdown',function(e){ if(e.target.closest('.wpcf7-submit')) fill(); },true);
    slot.addEventListener('wpcf7reset',function(){ setTimeout(fill,0); });
    var sb=slot.querySelector('.wpcf7-submit'); if(sb){ sb.value='Submit'; sb.classList.add('sub-btn'); }
    var ta=slot.querySelector('textarea'); if(ta) ta.setAttribute('rows','4');
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',go); else go();
})();
</script>
