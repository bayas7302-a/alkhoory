<!--
  Floating WhatsApp + Call buttons — Elementor HTML widget ("Floating contact buttons").
  Tracking: the <a>, its <svg> and its <path> all carry the same class, and the <a> also has it as id,
  so a GTM "Click Classes / Click ID equals" trigger matches wherever the visitor clicks.
    WhatsApp: whatsapp-landing-page-web-uae
    Call:     call-landing-page-web-uae
  Each click also pushes dataLayer events floating_whatsapp_click / floating_call_click.
-->
<style>
  .hl-float{position:fixed;right:22px;bottom:22px;z-index:9990;display:flex;flex-direction:column;gap:12px;align-items:flex-end;}
  .hl-float a.whatsapp-landing-page-web-uae,
  .hl-float a.call-landing-page-web-uae{
    position:relative;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;
    border:1.5px solid var(--hl-ink,#0e2a25);box-shadow:3px 3px 0 0 var(--hl-ink,#0e2a25);
    transition:transform .45s cubic-bezier(.22,1,.36,1), box-shadow .45s cubic-bezier(.22,1,.36,1);
  }
  .hl-float a.whatsapp-landing-page-web-uae{background:#25D366;}
  .hl-float a.call-landing-page-web-uae{background:var(--hl-coral,#e15338);}
  .hl-float a:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 0 var(--hl-ink,#0e2a25);}
  .hl-float a:active{transform:translate(1px,1px);box-shadow:1px 1px 0 0 var(--hl-ink,#0e2a25);}
  .hl-float svg{display:block;width:28px;height:28px;}
  .hl-float a.call-landing-page-web-uae svg{width:24px;height:24px;}
  .hl-float a.whatsapp-landing-page-web-uae::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:2px solid #25D366;animation:hl-pulse 2.4s ease-out infinite;pointer-events:none;}
  @keyframes hl-pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.55);opacity:0}}
  .hl-menu-open .hl-float{opacity:0;pointer-events:none;}
  @media (max-width:767px){.hl-float{right:14px;bottom:14px;gap:10px;}.hl-float a.whatsapp-landing-page-web-uae,.hl-float a.call-landing-page-web-uae{width:52px;height:52px;}}
  @media (prefers-reduced-motion:reduce){.hl-float a.whatsapp-landing-page-web-uae::after{animation:none;}}
</style>

<script nowprocket>
(function () {
  function init() {
    var fb = document.getElementById('hl-float-buttons');
    if (!fb) return;
    /* attach to <body> so position:fixed is always relative to the viewport */
    if (fb.parentNode !== document.body) document.body.appendChild(fb);
    if (fb.dataset.bound) return;
    fb.dataset.bound = '1';
    var last = {};
    fb.addEventListener('click', function (e) {
      var a = e.target.closest('a[data-track]');
      if (!a) return;
      var now = Date.now();
      if (last[a.id] && now - last[a.id] < 800) return;   /* count each click once (WP Rocket replays the first tap) */
      last[a.id] = now;
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({
        event: a.dataset.track === 'whatsapp' ? 'floating_whatsapp_click' : 'floating_call_click',
        button_id: a.id, link_url: a.href, page_path: location.pathname
      });
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
