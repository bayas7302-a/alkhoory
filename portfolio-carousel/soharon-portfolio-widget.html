<!--
  Portfolio carousel, Soharon style (old UAE landing page, /lp/ae/website-design-company/).
  Same data and behaviour as the Hee&Lee laptop carousel: place a Shortcode widget with
  [portfolio_carousel] directly BEFORE this HTML widget. Cards are only a laptop with the
  site scrolling inside its screen on hover, plus the project name. Click opens the live site.
-->
<style>
  .shp { --shp-red: #ee3523; --shp-red2: #ff9389; --shp-ink: #2b2b2b; --shp-grey: #54595f; --shp-gap: 28px; --shp-per: 3;
    font-family: Poppins, system-ui, sans-serif; width: 100%; position: relative; }
  .shp *, .shp *::before, .shp *::after { box-sizing: border-box; }
  .shp__track { display: flex; gap: var(--shp-gap); overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth;
    scrollbar-width: none; padding: 10px 2px 26px; cursor: grab; }
  .shp__track::-webkit-scrollbar { display: none; }
  .shp__track.is-dragging { cursor: grabbing; scroll-snap-type: none; scroll-behavior: auto; user-select: none; }
  .shp__track.is-dragging a { pointer-events: none; }
  .shp__card { flex: 0 0 calc((100% - var(--shp-gap) * (var(--shp-per) - 1)) / var(--shp-per) - 30px); scroll-snap-align: start;
    display: flex; flex-direction: column; gap: 14px; text-decoration: none; color: var(--shp-ink); -webkit-user-drag: none; }
  .shp__screen { display: block; position: relative; margin: 0 6.5%; aspect-ratio: 16 / 10; background: #0b0b0c;
    border: 9px solid #1c1c1e; border-bottom-width: 11px; border-radius: 14px 14px 0 0; overflow: hidden; }
  .shp__screen::before { content: ""; position: absolute; top: -6px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: #3a3a3c; z-index: 2; }
  .shp__site { position: absolute; inset: 0; background-color: #f2f2f2; background-repeat: no-repeat; background-size: 100% auto; background-position: 50% 0%;
    transition: background-position var(--shp-scroll, 6s) cubic-bezier(.45,.05,.55,.95); }
  .shp__card:hover .shp__site, .shp__card:focus-visible .shp__site { background-position: 50% 100%; }
  .shp__base { display: block; position: relative; height: 13px; margin-top: -14px; border-radius: 2px 2px 14px 14px;
    background: linear-gradient(180deg, #f1f2f4 0%, #d4d6d9 55%, #a9acb1 100%); box-shadow: 0 16px 26px -10px rgba(238,53,35,.45); }
  .shp__base::after { content: ""; position: absolute; top: 0; left: 50%; width: 16%; height: 5px; transform: translateX(-50%);
    background: linear-gradient(180deg, #b7b9bd, #d9dbde); border-radius: 0 0 8px 8px; }
  .shp__name { text-align: center; font-size: 15px; font-weight: 600; line-height: 1.3; margin-top: 4px; transition: color .3s ease; }
  .shp__name small { display: block; font-size: 12px; font-weight: 400; color: var(--shp-grey); letter-spacing: .5px; }
  .shp__card:hover .shp__name { color: var(--shp-red); }
  .shp__card:focus-visible { outline: 2px solid var(--shp-red); outline-offset: 4px; border-radius: 12px; }
  .shp__bar-row { display: flex; align-items: center; gap: 18px; }
  .shp__progress { position: relative; flex: 1; height: 4px; border-radius: 4px; background: #f1d6d3; cursor: pointer; touch-action: none; }
  .shp__progress::before { content: ""; position: absolute; inset: -10px 0; }
  .shp__thumb { position: absolute; top: 0; left: 0; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--shp-red), var(--shp-red2)); cursor: grab; }
  .shp__count { font-size: 14px; font-weight: 600; color: var(--shp-grey); white-space: nowrap; }
  .shp__count b { color: var(--shp-red); font-size: 20px; }
  .shp__btn { width: 50px; height: 50px; border-radius: 50%; border: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    font-size: 20px; color: #fff; background: linear-gradient(47deg, var(--shp-red) 0%, var(--shp-red2) 100%);
    box-shadow: -6px 10px 30px -8px rgba(255,92,92,.65); transition: transform .3s ease, opacity .3s ease; }
  .shp__btn:hover:not(:disabled) { transform: scale(1.06); }
  .shp__btn:disabled { opacity: .35; cursor: default; }
  @media (max-width: 1024px) { .shp { --shp-per: 2; } }
  @media (max-width: 640px) { .shp { --shp-per: 1; --shp-gap: 16px; } .shp__card { flex-basis: 82%; } .shp__btn { width: 42px; height: 42px; font-size: 17px; } }
  @media (prefers-reduced-motion: reduce) { .shp__track { scroll-behavior: auto; } .shp__site { transition: none; } }
</style>

<div class="shp" aria-roledescription="carousel" aria-label="Website portfolio">
  <div class="shp__track" tabindex="0"></div>
  <div class="shp__bar-row">
    <span class="shp__count" aria-live="polite"><b class="shp__cur">01</b> / <span class="shp__tot">00</span></span>
    <div class="shp__progress" role="scrollbar" aria-label="Scroll projects" aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="shp__thumb"></div></div>
    <button type="button" class="shp__btn shp__prev" aria-label="Previous project">&larr;</button>
    <button type="button" class="shp__btn shp__next" aria-label="Next project">&rarr;</button>
  </div>
</div>

<script nowprocket>
(function () {
  function init() { document.querySelectorAll('.shp').forEach(function (root) {
    if (root.dataset.init) return; root.dataset.init = '1';
    var track = root.querySelector('.shp__track');
    var esc = function (t) { var d = document.createElement('div'); d.textContent = t || ''; return d.innerHTML; };
    Array.prototype.forEach.call(document.querySelectorAll('.pc-carousel .pc-card'), function (c) {
      var title = c.getAttribute('data-title') || '', url = c.getAttribute('data-link') || '#';
      var img = c.getAttribute('data-full') || ((c.querySelector('img') || {}).src || '');
      var tag = (c.querySelector('.pc-tag') || {}).textContent || '';
      var a = document.createElement('a');
      a.className = 'shp__card'; a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.setAttribute('aria-label', 'Open ' + title + ' website');
      a.innerHTML = '<span class="shp__screen"><span class="shp__site" style="background-image:url(&quot;' + esc(img) + '&quot;) !important"></span></span>' +
        '<span class="shp__base"></span><span class="shp__name">' + esc(title) + (tag.trim() ? '<small>' + esc(tag.trim()) + '</small>' : '') + '</span>';
      var im = new Image();
      im.onload = function () { a.style.setProperty('--shp-scroll', Math.max(3, Math.min(14, im.naturalHeight / Math.max(1, im.naturalWidth) * 1.6)).toFixed(1) + 's'); };
      im.src = img;
      track.appendChild(a);
    });
    Array.prototype.forEach.call(document.querySelectorAll('.pc-carousel'), function (pc) { (pc.closest('.elementor-widget-shortcode') || pc).style.display = 'none'; });
    var host = root.closest('.e-con'); if (host) host.classList.add('e-no-lazyload');
    var cards = track.querySelectorAll('.shp__card'), count = cards.length; if (!count) return;
    var prev = root.querySelector('.shp__prev'), next = root.querySelector('.shp__next');
    var cur = root.querySelector('.shp__cur'), prog = root.querySelector('.shp__progress'), thumb = root.querySelector('.shp__thumb');
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    root.querySelector('.shp__tot').textContent = pad(count);
    function step() { return cards[0].getBoundingClientRect().width + (parseFloat(getComputedStyle(track).columnGap) || 0); }
    function maxScroll() { return Math.max(1, track.scrollWidth - track.clientWidth); }
    function update() {
      var f = Math.min(1, track.scrollLeft / maxScroll()), w = Math.max(.12, track.clientWidth / track.scrollWidth);
      thumb.style.width = (w * 100) + '%'; thumb.style.left = (f * (1 - w) * 100) + '%';
      prog.setAttribute('aria-valuenow', Math.round(f * 100));
      cur.textContent = pad(Math.min(count, Math.round(track.scrollLeft / step()) + 1));
      prev.disabled = track.scrollLeft < 4; next.disabled = track.scrollLeft > maxScroll() - 4;
    }
    prev.addEventListener('click', function () { track.scrollBy({ left: -step(), behavior: 'smooth' }); });
    next.addEventListener('click', function () { track.scrollBy({ left: step(), behavior: 'smooth' }); });
    track.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') { e.preventDefault(); next.click(); } else if (e.key === 'ArrowLeft') { e.preventDefault(); prev.click(); }
    });
    /* mouse drag (touch scrolls natively) */
    var drag = null, moved = false;
    track.addEventListener('pointerdown', function (e) { if (e.pointerType !== 'mouse' || e.button !== 0) return; drag = { x: e.clientX, s: track.scrollLeft }; moved = false; });
    window.addEventListener('pointermove', function (e) {
      if (!drag) return; var dx = e.clientX - drag.x;
      if (!moved && Math.abs(dx) > 5) { moved = true; track.classList.add('is-dragging'); }
      if (moved) track.scrollLeft = drag.s - dx;
    });
    window.addEventListener('pointerup', function () {
      if (!drag) return; drag = null;
      if (moved) { track.classList.remove('is-dragging'); var i = Math.round(track.scrollLeft / step()); track.scrollTo({ left: i * step(), behavior: 'smooth' }); }
    });
    track.addEventListener('click', function (e) { if (moved) { e.preventDefault(); moved = false; } }, true);
    track.addEventListener('dragstart', function (e) { e.preventDefault(); });
    /* draggable progress bar */
    var sb = false;
    function toFrac(x) { var r = prog.getBoundingClientRect(); return Math.max(0, Math.min(1, (x - r.left) / r.width)); }
    prog.addEventListener('pointerdown', function (e) { sb = true; prog.setPointerCapture(e.pointerId); track.style.scrollBehavior = 'auto'; track.scrollLeft = toFrac(e.clientX) * maxScroll(); });
    prog.addEventListener('pointermove', function (e) { if (sb) track.scrollLeft = toFrac(e.clientX) * maxScroll(); });
    prog.addEventListener('pointerup', function () { sb = false; track.style.scrollBehavior = ''; });
    var raf; track.addEventListener('scroll', function () { cancelAnimationFrame(raf); raf = requestAnimationFrame(update); }, { passive: true });
    window.addEventListener('resize', update); update();
  }); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
