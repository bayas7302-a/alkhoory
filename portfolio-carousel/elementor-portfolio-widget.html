<!--
  Portfolio carousel — "#work — Selected Projects" (Figma node 264:178)

  Place a Shortcode widget with [portfolio_carousel] directly BEFORE this HTML widget.
  This script reads the cards that shortcode renders from the "Website Portfolio" posts
  (title, category tag, screenshot, live URL), hides the original carousel and rebuilds it
  in the Figma design. Add/edit projects in WP Admin → Website Portfolio — no code changes.
  "Visit the site" opens the project's live website in a new tab.
-->

<style>
  .sio-portfolio {
    --sio-green: #065348;
    --sio-ink: #0e2a25;
    --sio-cream: #fff6ee;
    --sio-amber: #eeac4c;
    --sio-coral: #e15338;
    --sio-muted: #c9d8d3;
    --sio-slab: "TypoSlab Irregular Demo", var(--font-body, "Hanken Grotesk"), serif;
    --sio-display: var(--font-display, "Anton"), Impact, sans-serif;
    --sio-sans: var(--font-body, "Hanken Grotesk"), system-ui, sans-serif;
    --sio-gap: 24px;
    --sio-per-view: 3;

    background: var(--sio-green);
    padding: 110px 120px;
    display: flex;
    flex-direction: column;
    gap: 48px;
    overflow: hidden;
    box-sizing: border-box;
  }
  .sio-portfolio *, .sio-portfolio *::before, .sio-portfolio *::after { box-sizing: border-box; }
  .sio-portfolio__inner { width: 100%; max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px; }

  /* Header row */
  .sio-portfolio__head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .sio-portfolio__eyebrow { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; }
  .sio-portfolio__eyebrow::before { content: ""; width: 28px; height: 2px; background: var(--sio-amber); }
  .sio-portfolio__eyebrow span { font-family: var(--sio-slab); font-size: 13px; letter-spacing: 1.82px; color: var(--sio-amber); }
  .sio-portfolio__title { font-family: var(--sio-display); font-weight: 400; font-size: 60px; line-height: 1.02; color: var(--sio-cream); max-width: 640px; margin: 0; }

  /* Controls */
  .sio-portfolio__controls { display: flex; align-items: center; gap: 20px; }
  .sio-portfolio__counter { display: flex; align-items: flex-end; gap: 6px; }
  .sio-portfolio__current { font-family: var(--sio-display); font-size: 32px; line-height: 1; color: var(--sio-amber); }
  .sio-portfolio__total { font-family: var(--sio-sans); font-weight: 700; font-size: 15px; letter-spacing: .9px; color: var(--sio-muted); }
  .sio-portfolio__btn {
    width: 60px; height: 60px; border-radius: 30px; display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--sio-sans); font-weight: 700; font-size: 22px; line-height: 1; cursor: pointer; padding: 0;
    transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  .sio-portfolio__btn--prev { background: transparent; color: var(--sio-cream); border: 1.5px solid rgba(255,246,238,.5); }
  .sio-portfolio__btn--next { background: var(--sio-amber); color: var(--sio-ink); border: 1.5px solid var(--sio-ink); box-shadow: 3px 3px 0 var(--sio-ink); }
  .sio-portfolio__btn:hover:not(:disabled) { transform: translate(-1px,-1px); }
  .sio-portfolio__btn:disabled { opacity: .35; cursor: default; }
  .sio-portfolio__btn:focus-visible, .sio-card__cta:focus-visible { outline: 2px solid var(--sio-cream); outline-offset: 3px; }

  /* Track */
  .sio-portfolio__track {
    display: flex; gap: var(--sio-gap);
    overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth;
    scrollbar-width: none; -ms-overflow-style: none;
    /* let cards bleed past the right edge like the design ("next slide" peek) */
    margin-right: -120px; padding: 0 120px 4px 0;
  }
  .sio-portfolio__track::-webkit-scrollbar { display: none; }
  .sio-portfolio__track { cursor: grab; }
  .sio-portfolio__track.is-dragging { cursor: grabbing; scroll-snap-type: none; scroll-behavior: auto; user-select: none; }
  .sio-portfolio__track.is-dragging a { pointer-events: none; }

  /* Card: laptop mockup, site scrolls inside the screen on hover */
  .sio-card {
    flex: 0 0 calc((100% - 120px - var(--sio-gap) * (var(--sio-per-view) - 1)) / var(--sio-per-view));
    scroll-snap-align: start;
    display: flex; flex-direction: column; gap: 14px; color: var(--sio-cream);
  }
  .sio-laptop { display: block; position: relative; text-decoration: none; padding-bottom: 6px; -webkit-user-drag: none; }
  .sio-laptop__screen {
    display: block; position: relative; margin: 0 6.5%; aspect-ratio: 16 / 10;
    background: #0b0b0c; border: 9px solid #1c1c1e; border-bottom-width: 11px; border-radius: 14px 14px 0 0;
    overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .sio-laptop__screen::before { /* camera */
    content: ""; position: absolute; top: -6px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: #3a3a3c; z-index: 2;
  }
  .sio-laptop__site {
    position: absolute; inset: 0; background-color: #f2f2f2; background-repeat: no-repeat; background-size: 100% auto; background-position: 50% 0%;
    transition: background-position var(--sio-scroll, 6s) cubic-bezier(.45,.05,.55,.95);
  }
  .sio-card:hover .sio-laptop__site, .sio-laptop:focus-visible .sio-laptop__site { background-position: 50% 100%; transition-duration: var(--sio-scroll, 6s); }
  .sio-laptop__base {
    display: block; position: relative; height: 13px; border-radius: 2px 2px 14px 14px;
    background: linear-gradient(180deg, #f1f2f4 0%, #d4d6d9 55%, #a9acb1 100%);
    box-shadow: 0 10px 18px -8px rgba(0,0,0,.55);
  }
  .sio-laptop__base::after { /* opening notch */
    content: ""; position: absolute; top: 0; left: 50%; width: 16%; height: 5px; transform: translateX(-50%);
    background: linear-gradient(180deg, #b7b9bd, #d9dbde); border-radius: 0 0 8px 8px;
  }
  .sio-card__meta { margin: 6px 0 0; font-family: var(--sio-sans); font-weight: 500; font-size: 12px; letter-spacing: 1.1px; text-transform: uppercase; color: rgba(255,246,238,.82); }
  .sio-card__meta span { opacity: .6; margin: 0 8px; }
  .sio-card__title { margin: 0; font-family: var(--sio-sans); font-weight: 700; font-size: 19px; line-height: 1.3; color: var(--sio-cream); text-transform: none; }
  .sio-card__cta {
    align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; margin-top: 4px; padding: 11px 22px; border-radius: 100px;
    background: var(--sio-amber); color: var(--sio-ink); border: 1.5px solid var(--sio-ink); box-shadow: 3px 3px 0 var(--sio-ink);
    font-family: var(--sio-slab); font-size: 15px; line-height: 1; text-decoration: none; white-space: nowrap;
    transition: transform .45s cubic-bezier(.22,1,.36,1), box-shadow .45s cubic-bezier(.22,1,.36,1);
  }
  .sio-card__cta:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--sio-ink); color: var(--sio-ink); }

  /* Progress */
  .sio-portfolio__progress { position: relative; height: 4px; border-radius: 4px; background: rgba(255,246,238,.15); cursor: pointer; touch-action: none; transition: height .2s ease; }
  .sio-portfolio__progress::before { content: ""; position: absolute; left: 0; right: 0; top: -10px; bottom: -10px; }
  .sio-portfolio__progress:hover, .sio-portfolio__progress.is-dragging { height: 8px; }
  .sio-portfolio__bar { position: absolute; left: 0; top: 0; height: 100%; width: 33.333%; border-radius: 4px; background: var(--sio-amber); cursor: grab; }
  .sio-portfolio__progress.is-dragging .sio-portfolio__bar { cursor: grabbing; }

  @media (max-width: 1024px) {
    .sio-portfolio { padding: 80px 40px; --sio-per-view: 2; }
    .sio-portfolio__track { margin-right: -40px; padding-right: 40px; }
    .sio-card { flex-basis: calc((100% - 40px - var(--sio-gap) * (var(--sio-per-view) - 1)) / var(--sio-per-view)); }
    .sio-portfolio__title { font-size: 48px; }
  }
  @media (max-width: 640px) {
    .sio-portfolio { padding: 64px 16px; --sio-per-view: 1; --sio-gap: 16px; }
    .sio-portfolio__track { margin-right: -16px; padding-right: 16px; }
    .sio-card { flex-basis: 85%; }
    .sio-portfolio__title { font-size: 38px; }
    .sio-portfolio__btn { width: 50px; height: 50px; font-size: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sio-portfolio__track { scroll-behavior: auto; }
    .sio-portfolio *, .sio-portfolio *::before { transition: none !important; }
  }
</style>

<section class="sio-portfolio" id="work" aria-roledescription="carousel" aria-label="Selected website projects">
  <div class="sio-portfolio__inner">
    <div class="sio-portfolio__head">
      <div>
        <p class="sio-portfolio__eyebrow"><span>PORTFOLIO</span></p>
        <h2 class="sio-portfolio__title">OUR SELECTED WEBSITE PROJECTS</h2>
      </div>
      <div class="sio-portfolio__controls">
        <div class="sio-portfolio__counter" aria-live="polite">
          <span class="sio-portfolio__current">01</span>
          <span class="sio-portfolio__total">/ 00</span>
        </div>
        <button type="button" class="sio-portfolio__btn sio-portfolio__btn--prev" aria-label="Previous project">&larr;</button>
        <button type="button" class="sio-portfolio__btn sio-portfolio__btn--next" aria-label="Next project">&rarr;</button>
      </div>
    </div>

    <div class="sio-portfolio__track" tabindex="0">
      <!-- cards are built from the [portfolio_carousel] shortcode output (Website Portfolio posts) -->
    </div>

    <div class="sio-portfolio__progress" role="scrollbar" aria-label="Scroll projects" aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="sio-portfolio__bar"></div></div>
  </div>
</section>

<script nowprocket>
(function () {
  function init() { document.querySelectorAll('.sio-portfolio').forEach(function (root) {
    if (root.dataset.sioInit) return;
    root.dataset.sioInit = '1';

    var track = root.querySelector('.sio-portfolio__track');
    var esc = function (t) { var d = document.createElement('div'); d.textContent = t || ''; return d.innerHTML; };
    var src = document.querySelectorAll('.pc-carousel .pc-card');
    Array.prototype.forEach.call(src, function (c) {
      var title = c.getAttribute('data-title') || '';
      var url = c.getAttribute('data-link') || '#';
      var img = c.getAttribute('data-full') || ((c.querySelector('img') || {}).src || '');
      var tagEl = c.querySelector('.pc-tag');
      var a = document.createElement('article');
      a.className = 'sio-card';
      var tag = tagEl ? tagEl.textContent.trim() : '';
      var desc = tag ? (tag.charAt(0).toUpperCase() + tag.slice(1).toLowerCase() + ' website for ' + title) : ('Website for ' + title);
      a.innerHTML =
        '<a class="sio-laptop" href="' + esc(url) + '" target="_blank" rel="noopener" aria-label="Open ' + esc(title) + ' website">' +
          '<span class="sio-laptop__screen"><span class="sio-laptop__site" style="background-image:url(&quot;' + esc(img) + '&quot;) !important"></span></span>' +
          '<span class="sio-laptop__base"></span>' +
        '</a>' +
        '<p class="sio-card__meta">' + esc(title) + (tag ? '<span>|</span>' + esc(tag) : '') + '</p>' +
        '<h3 class="sio-card__title">' + esc(desc) + '</h3>' +
        '<a class="sio-card__cta" href="' + esc(url) + '" target="_blank" rel="noopener" aria-label="Visit the ' + esc(title) + ' website">Visit the site</a>';
      (function (card, src) {
        var im = new Image();
        im.onload = function () {
          var r = im.naturalHeight / Math.max(1, im.naturalWidth);   /* taller page = longer scroll */
          card.style.setProperty('--sio-scroll', Math.max(3, Math.min(14, r * 1.6)).toFixed(1) + 's');
        };
        im.src = src;
      })(a, img);
      track.appendChild(a);
    });
    Array.prototype.forEach.call(document.querySelectorAll('.pc-carousel'), function (pc) {
      var w = pc.closest('.elementor-widget-shortcode') || pc;
      w.style.display = 'none';
    });
    /* opt this section out of Elementor's lazy background loading (it hides background-image with !important) */
    var host = root.closest('.e-con'); if (host) host.classList.add('e-no-lazyload');
    var cards = Array.prototype.slice.call(track.querySelectorAll('.sio-card'));
    var prev = root.querySelector('.sio-portfolio__btn--prev');
    var next = root.querySelector('.sio-portfolio__btn--next');
    var current = root.querySelector('.sio-portfolio__current');
    var total = root.querySelector('.sio-portfolio__total');
    var bar = root.querySelector('.sio-portfolio__bar');
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    var count = cards.length;
    if (!count) return;
    total.textContent = '/ ' + pad(count);

    function step() {
      var gap = parseFloat(getComputedStyle(track).columnGap) || 0;
      return cards[0].getBoundingClientRect().width + gap;
    }
    function perView() {
      return Math.max(1, Math.round(parseFloat(getComputedStyle(root).getPropertyValue('--sio-per-view')) || 1));
    }
    function maxIndex() { return Math.max(0, count - perView()); }
    function index() { return Math.min(maxIndex(), Math.round(track.scrollLeft / step())); }

    var progress = root.querySelector('.sio-portfolio__progress');
    function maxScroll() { return Math.max(1, track.scrollWidth - track.clientWidth); }
    function update() {
      var i = index(), max = maxIndex(), pv = Math.min(perView(), count);
      current.textContent = pad(i + 1);
      prev.disabled = track.scrollLeft <= 2;
      next.disabled = track.scrollLeft >= maxScroll() - 2;
      var w = pv / count * 100, frac = Math.min(1, Math.max(0, track.scrollLeft / maxScroll()));
      bar.style.width = w + '%';
      bar.style.left = (frac * (100 - w)) + '%';
      progress.setAttribute('aria-valuenow', Math.round(frac * 100));
    }
    function go(i) {
      i = Math.max(0, Math.min(maxIndex(), i));
      track.scrollTo({ left: i * step() });
    }

    prev.addEventListener('click', function () { go(index() - 1); });
    next.addEventListener('click', function () { go(index() + 1); });
    track.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') { e.preventDefault(); go(index() + 1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); go(index() - 1); }
    });
    /* drag the cards with the mouse */
    var drag = null, suppressClick = false;
    track.addEventListener('click', function (ev) { if (suppressClick) { ev.preventDefault(); ev.stopPropagation(); } }, true);
    track.addEventListener('pointerdown', function (e) {
      if (e.pointerType !== 'mouse' || e.button !== 0) return;
      drag = { x: e.clientX, left: track.scrollLeft, moved: false, id: e.pointerId };
    });
    window.addEventListener('pointermove', function (e) {
      if (!drag || e.pointerId !== drag.id) return;
      var dx = e.clientX - drag.x;
      if (!drag.moved && Math.abs(dx) > 5) { drag.moved = true; track.classList.add('is-dragging'); }
      if (drag.moved) { e.preventDefault(); track.scrollLeft = drag.left - dx; }
    });
    function endDrag() {
      if (!drag) return;
      var moved = drag.moved; drag = null;
      if (moved) {
        var target = Math.round(track.scrollLeft / step());
        track.classList.remove('is-dragging');
        go(target);
        suppressClick = true;
        setTimeout(function () { suppressClick = false; }, 0);
      }
    }
    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', endDrag);
    track.addEventListener('dragstart', function (e) { e.preventDefault(); });

    /* scrollbar: drag the thumb or click the rail */
    var sb = null;
    function railFrac(clientX, offset) {
      var r = progress.getBoundingClientRect(), bw = bar.getBoundingClientRect().width;
      return Math.min(1, Math.max(0, (clientX - r.left - offset) / Math.max(1, r.width - bw)));
    }
    progress.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      var br = bar.getBoundingClientRect();
      var onThumb = e.clientX >= br.left && e.clientX <= br.right;
      sb = { offset: onThumb ? e.clientX - br.left : br.width / 2, id: e.pointerId };
      progress.setPointerCapture(e.pointerId);
      progress.classList.add('is-dragging');
      track.classList.add('is-dragging');
      track.scrollLeft = railFrac(e.clientX, sb.offset) * maxScroll();
    });
    progress.addEventListener('pointermove', function (e) {
      if (!sb || e.pointerId !== sb.id) return;
      track.scrollLeft = railFrac(e.clientX, sb.offset) * maxScroll();
    });
    function endSb() {
      if (!sb) return; sb = null;
      progress.classList.remove('is-dragging');
      track.classList.remove('is-dragging');
      go(Math.round(track.scrollLeft / step()));
    }
    progress.addEventListener('pointerup', endSb);
    progress.addEventListener('pointercancel', endSb);

    var raf;
    track.addEventListener('scroll', function () { cancelAnimationFrame(raf); raf = requestAnimationFrame(update); }, { passive: true });
    window.addEventListener('resize', update);
    update();
  }); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
